# OWiki 生产部署编排
# 镜像：Docker Hub（johnhom1024/owiki）
#
# 使用前设置环境变量：
#   OWIKI_ADMIN_PASSWORD=<强密码> docker compose up -d
services:
  owiki:
    image: johnhom1024/owiki:latest
    container_name: owiki
    ports:
      - '8787:8787'
    environment:
      OWIKI_DB: /data/owiki.db
      OWIKI_ADDR: ':8787'
      # 仅旧库迁移用（全新部署可随便填，vault 在 Web 端新建后各自有独立令牌）
      OWIKI_TOKEN: ${OWIKI_TOKEN:-}
      # Web 管理端登录账户：仅首次启动初始化（库里已有管理员则忽略）
      OWIKI_ADMIN_USER: ${OWIKI_ADMIN_USER:-admin}
      OWIKI_ADMIN_PASSWORD: ${OWIKI_ADMIN_PASSWORD:?请设置 OWIKI_ADMIN_PASSWORD 环境变量}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8787/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
