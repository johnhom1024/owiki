name: Sync Docker Hub README

# 把 docs/DOCKERHUB.md 推到 Docker Hub 仓库的 Full description。
# 该文件专为 Docker Hub 的 Markdown 渲染器维护（绝对链接），不要改成 GitHub README 的写法。
# 手动触发：Actions 页面 → Sync Docker Hub README → Run workflow
on:
  push:
    branches: [main]
    paths:
      - 'docs/DOCKERHUB.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: johnhom1024/owiki
          short-description: Self-hosted sync & wiki service for Obsidian notes
          readme-filepath: docs/DOCKERHUB.md
