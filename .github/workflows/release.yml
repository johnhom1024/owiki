name: Release Docker image

# 打 v* tag 即发版（scripts/tag.sh 只在本地打 tag，推远程后走这里）：
#   正式    v0.0.3          → docker.io/johnhom1024/owiki:0.0.3 + :latest
#                            + docker.cnb.cool/johnhom1024/owiki:0.0.3 + :latest（国内源）
#   预发布  v0.0.3-beta.1   → 同上但只推版本 tag（不推 :latest），GitHub Release 标 pre-release
#
# 仅构建 linux/amd64（NAS x86 部署，无需 arm64），原生构建不依赖 QEMU。
# 一次构建同时推 Docker Hub 与 CNB 制品库（buildx 多 tag 双 registry），两边 digest 一致。
# 版本号经 --build-arg VERSION 注入二进制，/api/health.version 透出。

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: johnhom1024/owiki
  CNB_IMAGE: docker.cnb.cool/johnhom1024/owiki

permissions:
  contents: write # 发 GitHub Release 说明本次镜像内容

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to CNB registry
        uses: docker/login-action@v4
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_REGISTRY_TOKEN }}

      - name: Compute version
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (prerelease, version tag only)
        if: steps.ver.outputs.prerelease == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.CNB_IMAGE }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (stable, version + latest)
        if: steps.ver.outputs.prerelease == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.CNB_IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.CNB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both registries
        run: |
          set -eu
          docker buildx imagetools inspect "${IMAGE}:${{ steps.ver.outputs.version }}" >/dev/null
          docker buildx imagetools inspect "${CNB_IMAGE}:${{ steps.ver.outputs.version }}" >/dev/null
          echo "✓ image live on Docker Hub and CNB"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          extra=()
          if [[ "$PRERELEASE" == "true" ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$tag" \
            --title "$tag" \
            "${extra[@]}" \
            --notes "Docker image \`johnhom1024/owiki:${version}\` published.

          国内镜像源（无需代理直连）：\`docker.cnb.cool/johnhom1024/owiki:${version}\`

          \`\`\`bash
          docker pull johnhom1024/owiki:${version}
          # 国内网络用：
          docker pull docker.cnb.cool/johnhom1024/owiki:${version}
          curl -s http://localhost:8787/api/health   # version 应为 ${version}
          \`\`\`" \
            --draft=false
