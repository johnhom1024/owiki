name: Release Docker image

# 打 v* tag 即发版（scripts/tag.sh 只在本地打 tag，推远程后走这里）：
#   正式    v0.0.3          → johnhom1024/owiki:0.0.3 + :latest，GitHub Release
#   预发布  v0.0.3-beta.1   → johnhom1024/owiki:0.0.3-beta.1（钉死，不更新 latest），GitHub pre-release
# 版本号经 --build-arg VERSION 注入二进制，/api/health.version 透出。
on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: johnhom1024/owiki

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发 GitHub Release 说明本次镜像内容
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (prerelease, pinned only)
        if: steps.ver.outputs.prerelease == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            johnhom1024/owiki:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (stable, version + latest)
        if: steps.ver.outputs.prerelease == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            johnhom1024/owiki:${{ steps.ver.outputs.version }}
            johnhom1024/owiki:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          extra=()
          if [[ "$PRERELEASE" == "true" ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$tag" \
            --title "$tag" \
            "${extra[@]}" \
            --notes "Docker image \`johnhom1024/owiki:${version}\` published.

          \`\`\`bash
          docker pull johnhom1024/owiki:${version}
          curl -s http://localhost:8787/api/health   # version 应为 ${version}
          \`\`\`" \
            --draft=false
