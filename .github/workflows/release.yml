name: Release Docker image

# 打 v* tag 即发版：
#   git tag v0.0.2 && git push origin v0.0.2
# 构建多架构镜像（amd64/arm64）推 Docker Hub：
#   johnhom1024/owiki:<版本号>（永久保留）+ :latest（滚动）
# 版本号经 --build-arg VERSION 注入二进制，/api/health.version 透出。
on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: johnhom1024/owiki

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发 GitHub Release 说明本次镜像内容
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            johnhom1024/owiki:${{ steps.ver.outputs.version }}
            johnhom1024/owiki:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Docker image \`johnhom1024/owiki:${GITHUB_REF_NAME#v}\` published.

          \`\`\`bash
          docker pull johnhom1024/owiki:${GITHUB_REF_NAME#v}
          curl -s http://localhost:8787/api/health   # version 应为 ${GITHUB_REF_NAME#v}
          \`\`\`" \
            --draft=false
